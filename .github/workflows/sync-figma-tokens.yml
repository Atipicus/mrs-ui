name: Sync Design Tokens from Figma

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview changes without creating PR)'
        required: false
        type: boolean
        default: false
  
  # Scheduled sync (every Monday at 9 AM UTC)
  schedule:
    - cron: '0 9 * * 1'

jobs:
  sync-tokens:
    name: Sync Figma Tokens
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      # ============================================
      # Checkout
      # ============================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # ============================================
      # Setup Node.js
      # ============================================
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # ============================================
      # Install dependencies
      # ============================================
      - name: 📦 Install dependencies
        run: npm ci
      
      # ============================================
      # Sync tokens from Figma
      # ============================================
      - name: 🔄 Sync tokens from Figma
        env:
          FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN MODE - Preview changes only"
            npm run tokens:sync:dry-run
          else
            echo "🔄 Syncing tokens from Figma..."
            npm run tokens:sync:pull
          fi
      
      # ============================================
      # Build tokens
      # ============================================
      - name: 🏗️ Build design tokens
        if: inputs.dry_run != true
        run: npm run tokens:build
      
      # ============================================
      # Check for changes
      # ============================================
      - name: 🔍 Check for token changes
        id: check_changes
        if: inputs.dry_run != true
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Token changes detected"
            git diff --stat
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No token changes detected"
          fi
      
      # ============================================
      # Validate tokens (optional)
      # ============================================
      - name: ✅ Validate token structure
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🔍 Validating token structure..."
          
          # Check if all required token files exist
          required_files=(
            "src/tokens/generated/css/tokens.css"
            "src/tokens/generated/scss/tokens.scss"
            "src/tokens/generated/ts/tokens.js"
            "src/tokens/generated/ts/tokens.d.ts"
            "src/tokens/generated/json/tokens-flat.json"
            "src/tokens/generated/json/tokens-nested.json"
            "src/tokens/generated/json/figma-tokens.json"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ Found: $file"
            fi
          done
          
          echo "✅ All token files validated successfully"
      
      # ============================================
      # Create Pull Request
      # ============================================
      - name: 🔀 Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(tokens): sync design tokens from Figma'
          branch: figma-tokens-sync/${{ github.run_number }}
          delete-branch: true
          title: '🎨 Sync Design Tokens from Figma'
          body: |
            ## 🎨 Design Token Sync
            
            This PR syncs design tokens from Figma using the automated workflow.
            
            ### 📊 Changes
            
            - **Source**: Figma Variables via Figma API
            - **Sync Date**: ${{ github.event.repository.updated_at }}
            - **Workflow Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 🔍 Files Changed
            
            The following files were updated:
            - Token source files (`src/tokens/source/**/*.json`)
            - Generated token exports (CSS, SCSS, TS, JSON)
            
            ### ✅ Validation
            
            - ✅ Token structure validated
            - ✅ All export formats generated successfully
            - ✅ Build process completed without errors
            
            ### 🚀 Next Steps
            
            1. **Review Changes**: Check the diff to ensure tokens are correct
            2. **Test Locally**: 
               ```bash
               git checkout figma-tokens-sync/${{ github.run_number }}
               npm run storybook
               ```
            3. **Merge**: If everything looks good, merge this PR
            
            ### 📝 Notes
            
            - This PR was created automatically by the Figma Token Sync workflow
            - Token changes may affect component styling in Storybook
            - Run visual regression tests (Chromatic) before merging
            
            ---
            
            🤖 **Automated by**: [Figma Token Sync Workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-figma-tokens.yml)
          labels: |
            design-tokens
            figma-sync
            automated
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
      
      # ============================================
      # Summary
      # ============================================
      - name: 📋 Job Summary
        if: always()
        run: |
          echo "# 🎨 Figma Token Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## 🔍 Dry Run Mode" >> $GITHUB_STEP_SUMMARY
            echo "Changes were previewed but not applied." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "## ✅ Sync Successful" >> $GITHUB_STEP_SUMMARY
            echo "Design tokens have been synced from Figma and a PR has been created." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --stat >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ℹ️ No Changes" >> $GITHUB_STEP_SUMMARY
            echo "No token changes were detected. Figma tokens are already up to date." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🤖 Workflow: **Figma Token Sync**" >> $GITHUB_STEP_SUMMARY
          echo "📅 Run Date: **$(date -u +"%Y-%m-%d %H:%M:%S UTC")**" >> $GITHUB_STEP_SUMMARY

