name: Validate Design Tokens

on:
  pull_request:
    paths:
      - 'src/tokens/source/**/*.json'
      - 'src/tokens/config/**'
      - '.github/workflows/validate-tokens.yml'

jobs:
  validate:
    name: Validate Token Changes
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # Checkout
      # ============================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # Setup Node.js
      # ============================================
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # ============================================
      # Install dependencies
      # ============================================
      - name: 📦 Install dependencies
        run: npm ci
      
      # ============================================
      # Validate JSON syntax
      # ============================================
      - name: ✅ Validate JSON syntax
        run: |
          echo "🔍 Validating JSON syntax in token files..."
          
          has_errors=false
          
          for file in src/tokens/source/**/*.json; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON in $file"
                has_errors=true
              else
                echo "✅ Valid JSON: $file"
              fi
            fi
          done
          
          if [ "$has_errors" = true ]; then
            echo "❌ JSON validation failed"
            exit 1
          fi
          
          echo "✅ All JSON files are valid"
      
      # ============================================
      # Validate DTCG format
      # ============================================
      - name: ✅ Validate DTCG format
        run: |
          echo "🔍 Validating DTCG token format..."
          
          # Check for required $value and $type properties
          node -e "
          const fs = require('fs');
          const path = require('path');
          const glob = require('glob');
          
          let hasErrors = false;
          
          const files = glob.sync('src/tokens/source/**/*.json');
          
          files.forEach(file => {
            const content = JSON.parse(fs.readFileSync(file, 'utf8'));
            
            function validateToken(obj, path = []) {
              for (const [key, value] of Object.entries(obj)) {
                if (typeof value === 'object' && value !== null) {
                  // Check if it's a token (has $value)
                  if ('$value' in value) {
                    if (!('$type' in value)) {
                      console.log(\`❌ Missing $type in \${file}: \${path.concat(key).join('.')}\`);
                      hasErrors = true;
                    } else {
                      console.log(\`✅ Valid token: \${path.concat(key).join('.')}\`);
                    }
                  } else {
                    // Recurse for nested objects
                    validateToken(value, path.concat(key));
                  }
                }
              }
            }
            
            console.log(\`\nValidating: \${file}\`);
            validateToken(content);
          });
          
          if (hasErrors) {
            console.log('\n❌ DTCG validation failed');
            process.exit(1);
          }
          
          console.log('\n✅ All tokens follow DTCG format');
          "
      
      # ============================================
      # Build tokens
      # ============================================
      - name: 🏗️ Build design tokens
        run: npm run tokens:build
      
      # ============================================
      # Check build output
      # ============================================
      - name: ✅ Validate build output
        run: |
          echo "🔍 Checking generated token files..."
          
          required_files=(
            "src/tokens/generated/css/tokens.css"
            "src/tokens/generated/scss/tokens.scss"
            "src/tokens/generated/scss/tokens-map.scss"
            "src/tokens/generated/ts/tokens.js"
            "src/tokens/generated/ts/tokens.d.ts"
            "src/tokens/generated/json/tokens-flat.json"
            "src/tokens/generated/json/tokens-nested.json"
            "src/tokens/generated/json/figma-tokens.json"
          )
          
          has_errors=false
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              has_errors=true
            else
              size=$(wc -c < "$file" | xargs)
              echo "✅ Generated: $file ($size bytes)"
            fi
          done
          
          if [ "$has_errors" = true ]; then
            echo "❌ Build output validation failed"
            exit 1
          fi
          
          echo "✅ All required files generated successfully"
      
      # ============================================
      # Check for breaking changes
      # ============================================
      - name: 🔍 Check for breaking changes
        run: |
          echo "🔍 Analyzing token changes for breaking changes..."
          
          # Get list of changed token source files
          changed_files=$(git diff --name-only origin/main...HEAD -- 'src/tokens/source/**/*.json' || echo "")
          
          if [ -z "$changed_files" ]; then
            echo "ℹ️ No token source files changed"
            exit 0
          fi
          
          echo "Changed token files:"
          echo "$changed_files"
          echo ""
          
          # Check for removed tokens (potential breaking changes)
          echo "⚠️ Checking for removed tokens..."
          
          git diff origin/main...HEAD -- 'src/tokens/source/**/*.json' | grep '^-' | grep '\$value' | while read line; do
            echo "⚠️ Potentially removed token: $line"
          done
          
          echo "✅ Breaking change analysis complete"
          echo "Note: Review removed tokens carefully before merging"
      
      # ============================================
      # Generate token diff report
      # ============================================
      - name: 📊 Generate token diff report
        if: always()
        run: |
          echo "# 🎨 Token Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count tokens
          total_tokens=$(find src/tokens/source -name "*.json" -exec grep -o '\$value' {} \; | wc -l)
          echo "## 📊 Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tokens**: $total_tokens" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List changed files
          changed_files=$(git diff --name-only origin/main...HEAD -- 'src/tokens/source/**/*.json' || echo "")
          if [ -n "$changed_files" ]; then
            echo "## 📝 Changed Files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$changed_files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "## 🔍 Changes Preview" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff origin/main...HEAD -- 'src/tokens/source/**/*.json' | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ℹ️ No Token Changes" >> $GITHUB_STEP_SUMMARY
            echo "No token source files were modified in this PR." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Validation Complete**" >> $GITHUB_STEP_SUMMARY
      
      # ============================================
      # Comment on PR with results
      # ============================================
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Count tokens
            const { execSync } = require('child_process');
            const totalTokens = execSync("find src/tokens/source -name '*.json' -exec grep -o '\\$value' {} \\; | wc -l").toString().trim();
            
            // Get changed files
            const changedFiles = execSync("git diff --name-only origin/main...HEAD -- 'src/tokens/source/**/*.json' || echo ''").toString().trim();
            
            const comment = `
            ## 🎨 Token Validation Results
            
            ✅ **All validations passed!**
            
            ### 📊 Statistics
            - **Total Tokens**: ${totalTokens}
            - **Format**: DTCG (Design Token Community Group)
            - **Export Formats**: CSS, SCSS, TypeScript, JSON
            
            ${changedFiles ? `### 📝 Changed Files\n\`\`\`\n${changedFiles}\n\`\`\`\n` : '### ℹ️ No token source files changed'}
            
            ### ✅ Validation Checks
            - ✅ JSON syntax valid
            - ✅ DTCG format compliant
            - ✅ Token build successful
            - ✅ All export formats generated
            
            ### 🚀 Next Steps
            1. Review token changes in the Files tab
            2. Test changes locally with \`npm run storybook\`
            3. Run visual regression tests (if configured)
            4. Merge when ready
            
            ---
            🤖 Automated by [Token Validation Workflow](${context.payload.repository.html_url}/actions/workflows/validate-tokens.yml)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

